aid: givecampus
name: Givecampus
description: >-
  GiveCampus is a digital-first fundraising and alumni-engagement platform built
  for educational institutions - K-12 schools, colleges, universities, and their
  affiliated foundations, alumni associations, and nonprofits. The platform
  provides online giving pages, Giving Days, crowdfunding and peer-to-peer
  (advocacy) fundraising, matching and challenge gifts, event and volunteer
  management, donor management and advancement CRM tooling, payment processing,
  and stewardship and engagement features that help advancement teams raise more
  money at a lower cost. Founded in 2015 and backed by Y Combinator, GiveCampus
  is used by thousands of schools and institutions across the United States and
  internationally. This API Evangelist profile tracks GiveCampus as a company in
  the network; the company operates a closed SaaS product and does not publish a
  public developer API, so this record is identity- and infrastructure-focused.
